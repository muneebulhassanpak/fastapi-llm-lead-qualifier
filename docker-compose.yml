services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside compose the database host is the service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://leadqual:leadqual@db:5432/leadqual
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadqual
      POSTGRES_PASSWORD: leadqual
      POSTGRES_DB: leadqual
    ports:
      # Host port 5433 avoids clashing with a Postgres already running on the machine.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadqual -d leadqual"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
