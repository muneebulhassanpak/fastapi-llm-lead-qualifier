[project]
name = "lead-qualification-api"
version = "0.1.0"
description = "FastAPI service that scores sales enquiries with an LLM, routes uncertain ones to human review, and syncs approved leads to a CRM."
readme = "README.md"
license = "MIT"
authors = [{ name = "Muhammad Muneeb-Ul-Hassan" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "pydantic[email]>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-ulid>=4.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "typer>=0.28.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit (security)
  "ASYNC",         # async pitfalls
  "C4",            # comprehensions
  "SIM",           # simplifications
  "RUF",           # ruff-specific
  "PT",            # pytest style
  "N",             # naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts, dummy secrets, seeded RNGs

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# asyncpg ships no type information; only the test suite imports it directly.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs database code in greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
