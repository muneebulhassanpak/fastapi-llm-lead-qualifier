name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job ids are referenced by the "Protect main" ruleset as required checks. Do not rename them.
# The steps are placeholders until Phase 02 adds the application code.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "ruff check and ruff format --check are added in Phase 02"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "mypy --strict is added in Phase 02"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "pytest is added in Phase 02"
