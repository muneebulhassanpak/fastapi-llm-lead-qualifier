name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job ids lint, typecheck, test, migrations and docker are required checks in the "Protect main" ruleset. Do not rename them.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy app tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadqual
          POSTGRES_PASSWORD: leadqual
          POSTGRES_DB: leadqual
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadqual" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://leadqual:leadqual@localhost:5432/leadqual_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadqual
          POSTGRES_PASSWORD: leadqual
          POSTGRES_DB: leadqual
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadqual" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://leadqual:leadqual@localhost:5432/leadqual
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Exactly one migration head
        run: |
          heads=$(uv run alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected 1 Alembic head, found $heads. Merge the heads with 'alembic merge'."
            uv run alembic heads
            exit 1
          fi
      - name: Upgrade an empty database
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Downgrade to empty
        run: uv run alembic downgrade base
      - name: Upgrade again
        run: uv run alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadqual
          POSTGRES_PASSWORD: leadqual
          POSTGRES_DB: leadqual
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadqual" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: lead-qualification-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (migrations + health)
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://leadqual:leadqual@localhost:5432/leadqual \
            -e RUN_MIGRATIONS=true \
            lead-qualification-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
